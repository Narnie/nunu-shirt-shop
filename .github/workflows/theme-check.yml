name: Theme Check

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @shopify/cli @shopify/theme

      # Fails only on errors; stock Dawn carries a few benign warnings.
      - run: shopify theme check --fail-level error
